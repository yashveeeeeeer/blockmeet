    <!-- GitHub Pages SPA redirect handler (paired with 404.html) -->
    <script>
      (function(l){
        if(l.search[1]==='/')
          var d=l.search.slice(1).split('&').map(function(s){return s.replace(/~and~/g,'&')}).join('?');
          if(d) window.history.replaceState(null,null,l.pathname.slice(0,-1)+d+(l.hash||''));
      }(window.location));
    </script>
